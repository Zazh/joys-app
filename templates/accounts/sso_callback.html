{% load i18n %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DR.JOYS — SSO</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fafaf9; }
        p { font-size: 14px; color: #78716c; }
    </style>
</head>
<body>
    <p>{% trans "Завершаем авторизацию..." %}</p>
    <!-- TODO: i18n JS strings -->
    <script>
    (function() {
        var success = {{ sso_success|yesno:"true,false" }};
        var payload = { type: 'sso_complete', success: success };

        // Канал 1: BroadcastChannel — не зависит от window.opener,
        // который COOP обнуляет после захода на страницу Google
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                var ch = new BroadcastChannel('drjoys_sso');
                ch.postMessage(payload);
                ch.close();
            }
        } catch(e) {}

        // Канал 2: postMessage (если opener пережил COOP)
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.postMessage(payload, window.location.origin);
            } catch(e) {}
        }

        // Канал 3: main.js в любом случае поллит /accounts/profile/

        // Пауза перед close — даём BroadcastChannel доставить сообщение
        setTimeout(function() {
            try { window.close(); } catch(e) {}
        }, 100);

        // Если window.close() не сработал (не popup, а основное окно) —
        // редирект на каталог
        setTimeout(function() {
            window.location.href = '/ru/catalog/';
        }, 500);
    })();
    </script>
</body>
</html>
