{% load i18n %}
<!-- BEGIN modal partner -->
<div class="modal-overlay hidden" id="modalPartner">
    <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
            <button class="modal-back" type="button" aria-label="{% trans "Назад" %}">
                {% include 'base/components/icons/_icon_back.html' %}
            </button>
            <button class="modal-close" id="modalPartnerClose" type="button" aria-label="{% trans "Закрыть" %}">
                {% include 'base/components/icons/_icon_close.html' %}
            </button>
        </div>

        <!-- Title -->
        <h2 class="modal-title">{% trans "Стать" %}<br>{% trans "партнером" %}</h2>

        <!-- Form -->
        <form class="flex flex-col gap-4" id="partnerForm" novalidate>

            <!-- Имя -->
            <div>
                <label class="modal-label" for="partnerName">{% trans "Имя" %}</label>
                <input class="modal-input" type="text" id="partnerName" name="name" required>
            </div>

            <!-- Страна проживания -->
            <div>
                <label class="modal-label" for="partnerCountry">{% trans "Страна проживания" %}</label>
                <input class="modal-input" type="text" id="partnerCountry" name="country" required>
            </div>

            <!-- Где планируете продавать -->
            <div>
                <label class="modal-label" for="partnerRegion">{% trans "Где планируете продавать" %}</label>
                <input class="modal-input" type="text" id="partnerRegion" name="region" required>
            </div>

            <!-- На сколько заинтересованы -->
            <fieldset>
                <legend class="modal-label">{% trans "На сколько заинтересованы в партнерстве?" %}</legend>
                <div class="flex flex-col gap-2 pt-1">
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="interest" value="ready" checked required>
                        <span class="modal-radio-text">{% trans "Готов инвестировать в ближайшее время" %}</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="interest" value="exploring">
                        <span class="modal-radio-text">{% trans "Пока просто изучаю информацию" %}</span>
                    </label>
                </div>
            </fieldset>

            <!-- Желаемый формат работы -->
            <fieldset>
                <legend class="modal-label">{% trans "Желаемый формат работы" %}</legend>
                <div class="flex flex-col gap-2 pt-1">
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="format" value="country_distributor" checked required>
                        <span class="modal-radio-text">{% trans "Стать дистрибьютором на всю страну" %}</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="format" value="city_distributor">
                        <span class="modal-radio-text">{% trans "Стать дистрибьютором на свой город" %}</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="format" value="wholesale">
                        <span class="modal-radio-text">{% trans "Стать оптовиком" %}</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="format" value="offline">
                        <span class="modal-radio-text">{% trans "У меня офлайн точка" %}</span>
                    </label>
                </div>
            </fieldset>

            <!-- Номер телефона -->
            <div>
                <label class="modal-label" for="partnerPhone">{% trans "Номер телефона" %}</label>
                <input class="modal-input" type="tel" id="partnerPhone" name="phone" placeholder="+7 (700) 123-45-67" required>
            </div>

            <!-- Способ связи -->
            <fieldset>
                <legend class="modal-label">{% trans "Способ связи" %}</legend>
                <div class="flex flex-col gap-2 pt-1">
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="contact" value="whatsapp" checked required>
                        <span class="modal-radio-text">{% trans "Написать на WhatsApp" %}</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="contact" value="telegram">
                        <span class="modal-radio-text">Telegram</span>
                    </label>
                    <label class="modal-radio-label">
                        <input class="modal-radio" type="radio" name="contact" value="call">
                        <span class="modal-radio-text">{% trans "Позвонить" %}</span>
                    </label>
                </div>
            </fieldset>

            <!-- Submit -->
            <button type="submit" class="btn-macro small danger w-full text-center">{% trans "Отправить" %}</button>
        </form>
    </div>
</div>
<!-- END modal partner -->
